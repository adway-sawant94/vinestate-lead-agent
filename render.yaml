services:
  - type: web
    name: vinestate-lead-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn lead_scraper.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GOOGLE_PLACES_API_KEY
        sync: false
